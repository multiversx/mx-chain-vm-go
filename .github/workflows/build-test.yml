name: Build and run tests

on:
  push:
    branches: [ master, rc/*, feat/* ]
  pull_request:
    branches: [ master, feat/*, rc/* ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.23.6]
        include:
          - os: ubuntu-latest
            test-command: make test
          - os: [self-hosted, macOS, ARM64]
            test-command: make test-w2
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Test
      run: | 
        ${{ matrix.test-command }}
