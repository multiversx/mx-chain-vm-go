name: Build and run tests

on:
  push:
    branches: [ master, rc/*, feat/* ]
  pull_request:
    branches: [ master, feat/*, rc/* ]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26.2
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Test Linux
      run: | 
        make test

  test-macos-arm64:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26.2
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Test MacOS ARM64
      run: | 
        make test-w2
